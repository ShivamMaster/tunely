name: Tunely
options:
  bundleIdPrefix: com.tunely
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tunely:
    type: application
    platform: iOS
    sources:
      - path: Tunely
    dependencies:
      - package: SpotifyiOS
        product: SpotifyiOS
    info:
      path: Tunely/Info.plist
      properties:
        CFBundleDisplayName: Tunely
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIBackgroundModes:
          - audio
        SpotifyPlaybackEnabled: true
        SpotifyClientID: "2c28f4d130114fd8aa0295958b2fe393"
        SpotifyRedirectURI: "tunely-spotify://callback"
        LSApplicationQueriesSchemes:
          - spotify
        CFBundleURLTypes:
          - CFBundleURLName: com.tunely.spotify-auth
            CFBundleURLSchemes:
              - tunely-spotify
    settings:
      base:
        PRODUCT_NAME: Tunely
        PRODUCT_BUNDLE_IDENTIFIER: com.tunely.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
  TunelyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TunelyUITests
    dependencies:
      - target: Tunely
    info:
      path: TunelyUITests/Info.plist
      properties:
        CFBundleDisplayName: TunelyUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunely.app.uitests
        TEST_TARGET_NAME: Tunely
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
schemes:
  Tunely:
    build:
      targets:
        Tunely: all
        TunelyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TunelyUITests
